# Vérifie puis publie la version web de tous les jeux sur GitHub Pages à chaque envoi sur main :
# https://smob-fr.github.io/jeux/<dossier du jeu>/
# À activer une fois : réglages du dépôt › Pages › Source : GitHub Actions.
name: Publier les jeux
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Tester tous les jeux
        run: npm test
      - name: Construire le site
        run: npm run site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
